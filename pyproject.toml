[project]
name = "radar"
version = "0.1.0"
description = "Outil personnel d'analyse de Polymarket : détection de flux informés, graphe de wallets, aide à la décision."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "DTZ"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["radar"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["db: tests qui nécessitent une base PostgreSQL (variable RADAR_TEST_DATABASE_URL)"]
